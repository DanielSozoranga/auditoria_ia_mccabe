spring.application.name=citas
server.port=3000

# base SQLite en un archivo, con una sola conexion porque SQLite escribe de a uno
spring.datasource.url=jdbc:sqlite:citas.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# las reglas de horario se leen en la hora del consultorio, no del servidor
citas.zona-horaria=America/Guayaquil

# rechaza tipos de dato que no coinciden en vez de convertirlos en silencio
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
