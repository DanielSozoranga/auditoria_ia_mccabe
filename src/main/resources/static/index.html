<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citas del medico familiar</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.5rem; }
    form { display: grid; gap: .6rem; grid-template-columns: 1fr 1fr; margin-bottom: 1rem; }
    label { display: flex; flex-direction: column; font-size: .85rem; gap: .2rem; }
    input, select, button { font: inherit; padding: .4rem; }
    button { cursor: pointer; }
    .ancho { grid-column: 1 / -1; }
    .ok { color: #176b2c; }
    .error { color: #b00020; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; font-size: .9rem; }
    .cancelada { color: #888; text-decoration: line-through; }
  </style>
</head>
<body x-data="citasApp()" x-init="cargar()">
  <h1>Citas del medico familiar</h1>

  <!-- formulario para agendar una cita -->
  <form @submit.prevent="agendar()">
    <label>Paciente
      <input type="text" x-model="form.paciente" required>
    </label>
    <label>Edad
      <input type="number" x-model.number="form.edad" min="0" required>
    </label>
    <label>Tipo de consulta
      <select x-model="form.tipo">
        <option value="general">General (14 anios o mas)</option>
        <option value="pediatrica">Pediatrica (menores de 14)</option>
      </select>
    </label>
    <label>Fecha y hora
      <input type="datetime-local" x-model="form.inicio" required>
    </label>
    <button class="ancho" type="submit">Agendar cita</button>
  </form>

  <!-- mensajes de exito o error que manda la API -->
  <p class="ok" x-show="mensaje" x-text="mensaje"></p>
  <p class="error" x-show="error" x-text="error"></p>

  <!-- lista de citas con el boton de cancelar -->
  <h2>Citas</h2>
  <label>
    <span><input type="checkbox" x-model="emergencia"> Cancelar como emergencia (sin multa)</span>
  </label>
  <table>
    <thead>
      <tr><th>Paciente</th><th>Tipo</th><th>Inicio</th><th>Estado</th><th>Multa</th><th></th></tr>
    </thead>
    <tbody>
      <!-- la llave incluye el estado para que la fila se redibuje al cancelar -->
      <template x-for="cita in citas" :key="cita.id + '-' + cita.estado">
        <tr :class="{ cancelada: cita.estado === 'cancelada' }">
          <td x-text="cita.paciente"></td>
          <td x-text="cita.tipo"></td>
          <td x-text="formatear(cita.inicio)"></td>
          <td x-text="cita.estado"></td>
          <td x-text="cita.penalizacion"></td>
          <td>
            <button x-show="cita.estado === 'activa'" @click="cancelar(cita.id)">Cancelar</button>
          </td>
        </tr>
      </template>
    </tbody>
  </table>

  <script>
    // logica de la pagina: habla con la API y guarda el estado de Alpine
    function citasApp() {
      return {
        citas: [],
        mensaje: '',
        error: '',
        emergencia: false,
        form: { paciente: '', edad: null, tipo: 'general', inicio: '' },

        // trae la lista de citas desde la API
        async cargar() {
          const respuesta = await fetch('/api/citas');
          this.citas = await respuesta.json();
        },

        // manda la cita nueva y muestra el resultado
        async agendar() {
          const respuesta = await fetch('/api/citas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.form),
          });
          await this.mostrar(respuesta, 'Cita agendada');
        },

        // cancela una cita y dice cuanto se cobro
        async cancelar(id) {
          const respuesta = await fetch('/api/citas/' + id + '/cancelar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ esEmergencia: this.emergencia }),
          });
          await this.mostrar(respuesta, 'Cita cancelada');
        },

        // pone el mensaje o el error segun la respuesta y recarga la lista
        async mostrar(respuesta, textoOk) {
          const datos = await respuesta.json();
          this.mensaje = respuesta.ok ? textoOk : '';
          this.error = respuesta.ok ? '' : datos.error;
          if (respuesta.ok && datos.penalizacion !== undefined) {
            this.mensaje += ', multa: ' + datos.penalizacion;
          }
          await this.cargar();
        },

        // muestra la fecha en formato local
        formatear(fecha) {
          return new Date(fecha).toLocaleString('es-EC');
        },
      };
    }
  </script>
  <script defer src="/vendor/alpine.js"></script>
</body>
</html>
