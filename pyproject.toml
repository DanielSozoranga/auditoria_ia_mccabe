[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=citas --cov-branch --cov-report=term-missing"

[tool.mutmut]
source_paths = ["citas/reglas.py"]
also_copy = ["citas/__init__.py", "citas/db.py", "citas/servicio.py"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["--no-cov"]
